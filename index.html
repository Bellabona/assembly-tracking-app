    background: linear-gradient(180deg, rgba(8,59,45,0.92), rgba(6,32,24,0.78));
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 6px 24px rgba(0,0,0,0.28);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-logo { height: 30px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35)); }
  .header-right { text-align: right; }
  .header-title {
    font-size: 15px; font-weight: 800; letter-spacing: 0.3px;
    color: var(--text); line-height: 1.1;
  }
  .header-date { font-size: 11px; font-weight: 600; color: var(--accent); margin-top: 2px; letter-spacing: 0.3px; }

  /* Content */
  .content {
    padding: 16px 16px 132px; max-width: 600px; margin: auto;
    animation: contentIn 0.55s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes contentIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Section label */
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.4px;
    text-transform: uppercase; color: var(--accent);
    margin: 24px 0 11px; display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

  /* Date */
  .date-pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--glass-shadow); transition: border-color 0.2s, box-shadow 0.2s;
  }
  .date-pill:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(142,219,90,0.18); }
  .date-pill .icon { font-size: 18px; }
  input[type="date"] {
    background: none; border: none; color: var(--text);
    font-size: 16px; font-weight: 600; flex: 1;
    outline: none; cursor: pointer; color-scheme: dark;
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(74%) sepia(38%) saturate(560%) hue-rotate(48deg); cursor: pointer;
  }

  /* Employee chips */
  .emp-scroll {
    display: flex; gap: 9px; overflow-x: auto;
    padding: 2px 2px 6px; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .emp-scroll::-webkit-scrollbar { display: none; }

  .emp-chip {
    flex-shrink: 0; scroll-snap-align: start;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; cursor: pointer; user-select: none;
    padding: 11px 12px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border2);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: all 0.28s cubic-bezier(0.34,1.56,0.64,1);
    position: relative; min-width: 66px;
  }
  .emp-chip:hover { border-color: var(--border); transform: translateY(-2px); }
  .emp-chip .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: var(--accent2);
    transition: all 0.24s ease;
  }
  .emp-chip .emp-name {
    font-size: 10px; font-weight: 700; color: var(--muted);
    white-space: nowrap; transition: color 0.18s;
  }
  .emp-chip.checked {
    border-color: var(--accent);
    background: rgba(142,219,90,0.14);
    transform: scale(1.05) translateY(-2px);
    box-shadow: 0 8px 22px rgba(142,219,90,0.22);
  }
  .emp-chip.checked .avatar {
    background: linear-gradient(145deg, var(--accent), var(--accent-deep));
    color: #062018; border-color: var(--accent2);
    box-shadow: 0 4px 14px rgba(142,219,90,0.4);
  }
  .emp-chip.checked .emp-name { color: var(--accent2); }
  .check-badge {
    display: none; position: absolute; top: 5px; right: 5px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); font-size: 9px;
    align-items: center; justify-content: center;
    color: #062018; font-weight: 900;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .emp-chip.checked .check-badge { display: flex; }

  /* Dish grid */
  .dishes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .dish-img {
    width: 100%; aspect-ratio: 4/3; object-fit: cover;
    border-radius: 11px; margin-bottom: 7px; background: #0d3527;
  }
  .dish {
    background: var(--surface); border: 1.5px solid var(--border2);
    border-radius: var(--radius); padding: 10px 6px 9px;
    text-align: center;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: all 0.24s cubic-bezier(0.34,1.56,0.64,1);
    position: relative; overflow: hidden; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.20);
  }
  .dish:hover { transform: translateY(-3px); border-color: var(--border); box-shadow: 0 10px 24px rgba(0,0,0,0.32); }
  .dish::before {
    content: ''; position: absolute; inset: 0; border-radius: var(--radius);
    background: radial-gradient(circle at 50% 0%, rgba(142,219,90,0.22), transparent 70%);
    opacity: 0; transition: opacity 0.24s; pointer-events: none;
  }
  .dish.has-value { border-color: var(--accent); background: rgba(142,219,90,0.10); box-shadow: 0 8px 22px rgba(142,219,90,0.18); }
  .dish.has-value::before { opacity: 1; }
  .dish .letter {
    font-size: 18px; font-weight: 800; color: var(--muted);
    line-height: 1; margin-bottom: 3px; transition: color 0.2s; position: relative;
  }
  .dish.has-value .letter { color: var(--accent2); }
  .dish .dish-name {
    font-size: 8.5px; color: #7f9d86; line-height: 1.25;
    min-height: 20px; margin-bottom: 7px; position: relative;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    transition: color 0.2s;
  }
  .dish.has-value .dish-name { color: var(--accent2); }
  .dish input[type="number"] {
    width: 100%; padding: 9px 2px;
    border-radius: 11px; border: 1px solid var(--border2);
    background: rgba(0,0,0,0.22); color: var(--text);
    font-size: 18px; font-weight: 800; text-align: center;
    outline: none; transition: all 0.15s; cursor: text;
    -webkit-appearance: none; pointer-events: none; position: relative;
  }
  .dish input[type="number"]:focus,
  .dish.editing input[type="number"] {
    border-color: var(--accent);
    background: rgba(142,219,90,0.14);
    box-shadow: 0 0 0 3px rgba(142,219,90,0.22);
    pointer-events: auto;
  }
  .dish input[type="number"]::-webkit-inner-spin-button,
  .dish input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

  /* Role tabs */
  .role-tabs { display: flex; gap: 9px; }
  .role-tab {
    flex: 1; padding: 13px 8px; border-radius: 14px;
    border: 1px solid var(--border2); background: var(--surface);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--muted); font-size: 13px; font-weight: 700;
    text-align: center; cursor: pointer; transition: all 0.18s; user-select: none;
  }
  .role-tab:hover { border-color: var(--border); color: var(--text); }
  .role-tab.active {
    border-color: var(--accent); background: rgba(142,219,90,0.16); color: var(--accent2);
    box-shadow: 0 6px 18px rgba(142,219,90,0.2);
  }

  /* Comment */
  textarea {
    width: 100%; padding: 13px 15px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--surface);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--text); font-size: 15px; resize: none;
    min-height: 68px; outline: none; font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(142,219,90,0.16); }
  textarea::placeholder { color: var(--muted); }

  /* Error */
  .error-msg {
    display: none; margin-top: 12px;
    background: rgba(255,107,107,0.12); color: var(--danger);
    border: 1px solid rgba(255,107,107,0.28);
    border-radius: 12px; padding: 11px 14px; font-size: 14px;
  }
  .error-msg.visible { display: block; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.35s ease; }

  /* Submit bar */
  .submit-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    padding: 13px 16px calc(13px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(6,32,24,0.98), rgba(6,32,24,0.72));
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-top: 1px solid var(--border);
  }
  .submit-total {
    font-size: 12px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--accent2);
    text-align: center; margin: 0 0 9px; min-height: 15px;
  }
  #submitBtn {
    width: 100%; padding: 16px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, #a3e86a 0%, #8EDB5A 45%, #6bc23f 100%);
    color: #05261b; font-size: 17px; font-weight: 800; letter-spacing: 0.3px; cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 6px 22px rgba(142,219,90,0.42), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  #submitBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(142,219,90,0.55), inset 0 1px 0 rgba(255,255,255,0.35); }
  #submitBtn:active:not(:disabled) { transform: scale(0.98); }
  #submitBtn:disabled { background: rgba(255,255,255,0.06); color: #5c766a; box-shadow: none; cursor: not-allowed; }

  /* Success */
  .success-screen {
    display: none; min-height: 100vh;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 24px;
    animation: fadeUp 0.45s ease;
  }
  .success-screen.visible { display: flex; }
  @keyframes fadeUp {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .success-ring {
    width: 92px; height: 92px; border-radius: 50%; margin-bottom: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; color: #062018;
    background: linear-gradient(145deg, var(--accent), var(--accent-deep));
    box-shadow: 0 12px 34px rgba(142,219,90,0.45);
    animation: fadeUp 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  .success-title { font-size: 28px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
  .success-detail {
    font-size: 13px; color: var(--muted); line-height: 1.8;
    max-width: 320px; margin: 0 auto 32px;
  }
  .success-detail span {
    display: inline-block; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 2px 8px; margin: 2px; font-size: 12px; color: var(--text);
  }
  .btn-again {
    padding: 14px 36px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, #a3e86a, #6bc23f);
    color: #05261b; font-size: 16px; font-weight: 800; cursor: pointer;
    box-shadow: 0 6px 22px rgba(142,219,90,0.4); transition: all 0.18s;
  }
  .btn-again:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(142,219,90,0.5); }

  .emp-chip.disabled { opacity: .32; pointer-events: none; filter: grayscale(1); }
  .role-tabs.disabled { opacity: .45; pointer-events: none; }

  /* Responsive */
  @media (min-width: 620px) {
    .dishes { grid-template-columns: repeat(6, 1fr); }
    .dish .dish-name { font-size: 9px; }
  }
  @media (max-width: 360px) {
    .dishes { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>

    <div class="header-title">Assembly Tracking</div>

<div class="content" id="formSection">

  <div class="section-label">Date</div>

    <span class="icon">&#128197;</span>

<script>
/* ---------------------------------------------------------------------------
 * Local dish thumbnails (see tools/make-thumbs.sh).
 *
 * DISH_IMAGES points at full-resolution S3 images (~1.5 MB each, ~35 MB for a
 * week of 24 dishes) that we render into ~80px tiles on kitchen phones. The
 * script pre-builds ~13 kB WebP thumbs under thumbs/ and rewrites the manifest
 * line below, which lists every uuid that has a committed thumb.
 *
 * KEYED BY THE S3 IMAGE UUID, NEVER BY DISH LETTER: the weekly scheduled task
 * reassigns letters to different dishes, so a letter-keyed thumb would silently
 * show the WRONG photo. A uuid that is not in the manifest simply has no thumb
 * yet, and we request the original S3 URL instead: slower, but always right,
 * and with no wasted 404. Do not hand-edit the manifest line; re-run the script
 * after the weekly task swaps the dishes and commit thumbs/ + index.html
 * together, so a deployed index.html never points at an undeployed thumb.
 * ------------------------------------------------------------------------- */
/* THUMB_UUIDS-BEGIN generated by tools/make-thumbs.sh -- do not hand-edit */
const THUMB_UUIDS = {"095eb07d-9bb2-4a75-936c-676da52108ec":1,"121256c2-ea39-4365-b7c8-807523882b5e":1,"1612279b-75df-445d-a1e0-264a4609e0c6":1,"19a84260-c532-4bfe-a155-ee766ee02de5":1,"20914ac4-bdbc-4514-ad9d-3d91d8253c18":1,"2ac07483-8ea4-4f12-9ca7-4470dcab49a4":1,"2b105cba-8bc0-4cc6-8828-d72671e3264c":1,"41221ae9-4322-4259-8006-0889ba6f26f5":1,"55c100b9-b6d2-45af-8fef-a67b0a208590":1,"5fa5f0c4-074c-49ca-a79f-80768b1db0dd":1,"5fc698c2-c88b-40a9-870d-4252521076a7":1,"65718e10-f6ac-11ea-8b17-3b1c8872d158":1,"96dc9d62-be95-4b96-9b31-1dcd5fb98ff3":1,"9d18e0d0-303e-4bee-8001-4cac8036f7dd":1,"a43bbb9b-d605-46dc-b072-16740be93db8":1,"acb83bde-347a-45f0-867a-dae8e833987e":1,"b2ee8fe7-84b1-4ef5-8565-09f012269c8a":1,"b556a4cc-a9ad-421f-a715-76313f594bb9":1,"b76c3e7c-8a72-493a-9f3b-cf918b70678c":1,"bf2cbf30-ebb9-11eb-bf3e-4d3f316ceaeb":1,"c7439cd5-4895-434d-8f84-a8eaceccad23":1,"d5239ae7-8f79-4d5f-8829-317ccada47dc":1,"ece8c7ce-f929-4b95-ab05-6d8aa483b54b":1,"ffc1f6c2-9bee-4b28-ade9-b763a6e4616a":1};
/* THUMB_UUIDS-END */

// Relative path on purpose: "/thumbs/..." would resolve to the domain root and
// always 404 on a project Pages site. Lowercased because Pages is
// case-sensitive while macOS (which runs the generator) is not.
// Keep this extraction rule identical to the one in tools/make-thumbs.sh:
// the uuid is the path segment right after /ProductImages/, not the filename.
function thumbPathFor(url) {
  const known = (typeof THUMB_UUIDS === "object" && THUMB_UUIDS) ? THUMB_UUIDS : {};
  const m = /\/ProductImages\/([0-9a-f-]{8,64})\//i.exec(url || "");
  if (!m) return "";
  const uuid = m[1].toLowerCase();
  return known[uuid] ? "thumbs/" + uuid + ".webp" : "";
}

// Tiles follow DISH_NAMES, so the weekly auto-update decides which ones exist.
const DISH_LETTERS = Object.keys(DISH_NAMES);
// Sanity ceiling per dish per entry: a shift is tens of a dish, never hundreds,
// so a fat-fingered 900 is refused instead of becoming truth.
const MAX_PER_DISH = 400;

// Whole non-negative counts only: 0 for empty, NaN for anything else.
function parseCount(value) {
  const raw = String(value == null ? "" : value).trim();
  if (raw === "") return 0;
  if (!/^\d+$/.test(raw)) return NaN;
  return parseInt(raw, 10);
}

  const imgUrl = DISH_IMAGES[letter];
  if (imgUrl) {
    const thumb = thumbPathFor(imgUrl);
    const img = document.createElement("img");  // built as a DOM node, never as
    img.className = "dish-img";                 // an innerHTML string: no quoting
    img.alt = "";                               // surface for URLs or names.
    img.loading = "lazy";
    img.decoding = "async";
    // Single-shot fallback. this.onerror = null FIRST makes a loop impossible:
    // the handler fires at most once per <img>, and only ever swaps the local
    // thumb for the original S3 URL. It never points back at the thumb.
    img.onerror = function () {
      this.onerror = null;
      if (thumb && this.src !== imgUrl) this.src = imgUrl;
    };
    img.src = thumb || imgUrl;                  // handler attached BEFORE src
    div.insertBefore(img, div.firstChild);      // image stays above .letter
  }
  const inp = div.querySelector("input");
  inp.addEventListener("input", () => {
    div.classList.toggle("has-value", parseCount(inp.value) > 0);
    updateTotal();
    saveDraft();
  });
  div.addEventListener("click", (e) => {
    if (e.target === inp) return;
    div.classList.add("editing");
    inp.style.pointerEvents = "auto";
    inp.focus();
    inp.select();
  });
  inp.addEventListener("blur", () => {
    div.classList.remove("editing");
    inp.style.pointerEvents = "none";
  });
  inp.addEventListener("focus", () => {
    div.classList.add("editing");
    inp.style.pointerEvents = "auto";
  });
  dishBox.appendChild(div);
});

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = msg;
  el.classList.add("visible");
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
  setTimeout(() => el.classList.remove("shake"), 400);
}
function clearError() { document.getElementById("errorMsg").classList.remove("visible"); }

function submitForm() {
  clearError();
  const date = document.getElementById("date").value;
  const comment = document.getElementById("comment").value.trim();
  const selectedEmployees = [...document.querySelectorAll(".emp-chip.checked")].map(c => c.dataset.name);
  let dishes = [];
  let notWhole = "";
  let tooMany = "";
  for (const l of DISH_LETTERS) {
    const inp = document.getElementById("dish_"+l);
    if (!inp) continue;
    const qty = parseCount(inp.value);
    if (isNaN(qty)) { notWhole = l; break; }
    if (qty > MAX_PER_DISH) { tooMany = l; break; }
    if (qty > 0) dishes.push(l+":"+qty);
  }
  // showError writes to textContent, so these must be real characters, not HTML
  // entities. Written as \uXXXX escapes to keep every byte of this file ASCII.
  if (!date) { showError("\u26A0\uFE0F Please select a date."); return; }
  if (selectedEmployees.length !== 1) { showError("\u26A0\uFE0F Please select your name."); return; }
  if (notWhole) { showError("\u26A0\uFE0F Dish "+notWhole+": whole numbers only \u2014 no decimals, no minus."); return; }
  if (tooMany) { showError("\u26A0\uFE0F Dish "+tooMany+": that is higher than "+MAX_PER_DISH+" \u2014 please check the number."); return; }
  if (!dishes.length) { showError("\u26A0\uFE0F Please enter a quantity for at least one dish."); return; }

  const roles = getSelectedRoles();
  if (!roles.length) { showError("\u26A0\uFE0F Please select at least one role."); return; }
  const rolesStr = roles.join(", ");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Saving\u2026";

  fetch(SCRIPT_URL, {
    method: "POST",
    redirect: "follow",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({ date, employees: selectedEmployees, dishes: dishes.join(" | "), role: rolesStr, comment })
  })
  .then(async (res) => {
    if (!res.ok) throw new Error("server said HTTP "+res.status);
    const body = await res.text();
    if (looksLikeSaveFailure(body)) throw new Error("the sheet rejected the entry");
    clearDraft();
    document.getElementById("successDetail").innerHTML =
      date+"<br>"+selectedEmployees.map(n=>"<span>"+n+"</span>").join(' ')+"<br>"+dishes.map(d=>"<span>"+d+"</span>").join(' ')+"<br><span>"+rolesStr+"</span>";
    document.getElementById("formSection").style.display = "none";
    document.getElementById("submitBar").style.display = "none";
    document.getElementById("successScreen").classList.add("visible");
  })
  .catch(err => {
    const reason = (err && err.message) ? err.message : "no connection";
    showError("\u274C NOT saved \u2014 " + reason + ". Your numbers are still on screen: check the connection and tap Submit Entry again. If it keeps failing, report it before closing this page.");
    btn.disabled = false; btn.textContent = "Submit Entry";
  });
}

  document.querySelectorAll(".emp-chip").forEach(c => { c.classList.remove("checked"); c.classList.remove("disabled"); });

// --- Running total: the cheapest typo catcher we have -----------------------
function currentTotal() {
  let total = 0;
  DISH_LETTERS.forEach(l => {
    const inp = document.getElementById("dish_"+l);
    if (!inp) return;
    const qty = parseCount(inp.value);
    if (qty > 0) total += qty;
  });
  return total;
}
function updateTotal() {
  const total = currentTotal();
  document.getElementById("totalLine").textContent =
    "Total: "+total+(total === 1 ? " dish" : " dishes");
}

// --- Draft persistence ------------------------------------------------------
const DRAFT_KEY = "bb_assembly_draft_v1";
const DRAFT_MAX_AGE_MS = 18 * 60 * 60 * 1000;

// Counts are keyed by letter and the weekly task reassigns letters to other
// dishes, so a draft is only valid while DISH_NAMES is byte-identical.
function dishSignature() {
  return DISH_LETTERS.map(l => l+"="+DISH_NAMES[l]).join("|");
}

function saveDraft() {
  const counts = {};
  DISH_LETTERS.forEach(l => {
    const inp = document.getElementById("dish_"+l);
    if (inp && inp.value !== "") counts[l] = inp.value;
  });
  const chip = document.querySelector(".emp-chip.checked");
  const draft = {
    signature: dishSignature(),
    day: getTodayLocal(),
    savedAt: Date.now(),
    date: document.getElementById("date").value,
    employee: chip ? chip.dataset.name : "",
    roles: getSelectedRoles(),
    comment: document.getElementById("comment").value,
    counts: counts
  };
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  } catch (e) { /* private mode or quota: drafts are best effort */ }
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
}

function readDraft() {
  let raw = null;
  try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { return null; }
  if (!raw) return null;
  let draft = null;
  try { draft = JSON.parse(raw); } catch (e) { clearDraft(); return null; }
  if (!draft || typeof draft !== "object") { clearDraft(); return null; }
  if (draft.signature !== dishSignature()) { clearDraft(); return null; }
  if (draft.day !== getTodayLocal()) { clearDraft(); return null; }
  if (!draft.savedAt || (Date.now() - draft.savedAt) > DRAFT_MAX_AGE_MS) { clearDraft(); return null; }
  return draft;
}

function restoreDraft() {
  const draft = readDraft();
  if (!draft) return;
  if (draft.date) document.getElementById("date").value = draft.date;
  if (draft.comment) document.getElementById("comment").value = draft.comment;
  const counts = draft.counts || {};
  DISH_LETTERS.forEach(l => {
    if (!Object.prototype.hasOwnProperty.call(counts, l)) return;
    const inp = document.getElementById("dish_"+l);
    if (!inp) return;
    inp.value = counts[l];
    const tile = document.getElementById("tile_"+l);
    if (tile) tile.classList.toggle("has-value", parseCount(inp.value) > 0);
  });
  // Replay real clicks so chips, the disabling of the other chips and the
  // roles-enabled state come from the existing handlers, not a second copy.
  if (draft.employee) {
    const chip = [...document.querySelectorAll(".emp-chip")].find(c => c.dataset.name === draft.employee);
    if (chip) chip.click();
  }
  const roles = draft.roles || [];
  roleTabs.querySelectorAll(".role-tab").forEach(tab => {
    if (roles.indexOf(tab.dataset.role) !== -1) tab.click();
  });
}

// --- Did the save really land? ----------------------------------------------
// We cannot change the Apps Script and do not know doPost's exact reply, so
// only treat a response as failed when it actually says so.
function looksLikeSaveFailure(body) {
  const text = (body || "").trim();
  if (!text) return false;
  let parsed = null;
  let isJson = true;
  try { parsed = JSON.parse(text); } catch (e) { isJson = false; }
  if (isJson) {
    if (!parsed || typeof parsed !== "object") return false;
    const status = String(parsed.status || parsed.result || "").toLowerCase();
    if (status === "error" || status === "failed") return true;
    if (parsed.ok === false || parsed.success === false) return true;
    if (parsed.error || parsed.errorMessage) return true;
    return false;
  }
  return /<html|Exception|ScriptError|errorMessage/i.test(text);
}

document.getElementById("date").addEventListener("change", saveDraft);
document.getElementById("comment").addEventListener("input", saveDraft);
