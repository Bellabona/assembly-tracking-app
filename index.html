<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#062018" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<title>BellaBona &#127837; Assembly</title>
<style>
  /* ════════════════════════════════════════════════════════════════════════
     Bella & Bona — Assembly Tracking
     Design system, October 2026.

     This file is presentation only. Every selector below already existed in the
     markup or is produced by the tile builder in the script; nothing here asks
     the application to behave differently. The class names the script toggles
     (.has-value, .has-waste, .editing, .checked, .active, .disabled, .visible,
     .queued, .shake) are all honoured.

     Three decisions shape it.

     LIGHT, NOT DARK. The old interface was dark with a photographic band behind
     the content. A collage competing with twenty-six dish tiles is the reason
     the screen felt crowded: there was no quiet surface for anything to sit on.
     Content now sits on near-white cards on a warm grey page, which is also 60 KB
     lighter to load on kitchen wifi, because the background was an inline JPEG.

     SYSTEM TYPE, NOT A WEBFONT. Inter would mean a request to a third party that
     the service worker does not cache, so the first paint in a kitchen with bad
     signal would be a flash of fallback, or no text at all. The stack below
     resolves to SF Pro on the phones this runs on and to Segoe or Roboto
     elsewhere. Same intent, no dependency, nothing to go wrong offline.

     ONE SCALE. Spacing, radius and type come from the tokens below rather than
     from numbers chosen per component, which is what made the old screen feel
     unsettled.
     ════════════════════════════════════════════════════════════════════════ */

  :root {
    /* Brand. Deep forest green carries the chrome; lime is reserved for the
       primary action and for "this has a value", never for decoration. */
    --brand:        #0B4A33;
    --brand-dark:   #06301F;
    --brand-mid:    #116044;
    --brand-soft:   #E8F1EB;
    --brand-softer: #F2F7F3;
    --lime:         #8EDB5A;
    --lime-ink:     #3E7A1F;   /* lime is unreadable on white; this is its text form */
    --lime-deep:    #6BC23F;

    /* Surfaces */
    --bg:        #F4F6F3;
    --card:      #FFFFFF;
    --card-2:    #FAFBF9;
    --line:      #E2E7E1;
    --line-2:    #D3DAD2;

    /* Text */
    --ink:       #16211B;
    --ink-2:     #425049;
    --muted:     #6E7D74;
    --faint:     #93A098;

    /* Signals. Used only where something is actually wrong or exceptional. */
    --danger:     #B3261E;
    --danger-bg:  #FDECEA;
    --danger-line:#F3C9C4;
    --warn:       #8A5A09;
    --warn-bg:    #FDF4E3;
    --warn-line:  #EFDCB4;

    --radius:    14px;
    --radius-sm: 10px;
    --radius-lg: 18px;

    --shadow-sm: 0 1px 2px rgba(16,36,27,0.05);
    --shadow:    0 2px 8px rgba(16,36,27,0.06);
    --shadow-lg: 0 -2px 16px rgba(16,36,27,0.10);

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;

    /* Height of the fixed footer, so the page can reserve exactly that much and
       no more. The old layout guessed 132px and left a band of dead space. */
    --bar-h: 76px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* A single flat tint rather than a photograph. The work is the dish grid; the
     background's only job is to stay out of its way. */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: var(--bg);
  }

  :focus-visible { outline: 3px solid var(--lime-deep); outline-offset: 2px; border-radius: 4px; }

  /* ───────────────────────────── header ───────────────────────────── */

  .app-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--brand);
    padding: 10px 20px;
    padding-top: calc(10px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .header-logo { height: 17px; width: auto; flex-shrink: 0; }

  /* One row, aligned on the baseline, instead of a stack of right-aligned
     fragments. Everything after the wordmark is navigation and settings. */
  .header-right {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 6px 18px;
    flex-wrap: wrap; justify-content: flex-end; text-align: left;
  }
  .header-title {
    font-size: 14px; font-weight: 650; letter-spacing: -0.01em;
    color: #FFFFFF; line-height: 1.2; margin-right: auto;
  }
  .header-date {
    font-size: 12px; font-weight: 550; color: rgba(255,255,255,0.72);
    letter-spacing: 0; line-height: 1.2; white-space: nowrap;
  }
  .header-link {
    font-size: 12.5px; font-weight: 550; color: rgba(255,255,255,0.72);
    text-decoration: none; white-space: nowrap;
    padding: 6px 2px; border-radius: 6px; transition: color 0.15s;
  }
  .header-link:hover, .header-link:focus-visible { color: #FFFFFF; }

  .glove-toggle {
    font-size: 12.5px; font-weight: 550; letter-spacing: 0;
    color: rgba(255,255,255,0.72); background: none;
    border: 1px solid transparent; border-radius: 8px;
    padding: 6px 10px; margin: 0; font-family: inherit; cursor: pointer;
    white-space: nowrap; transition: all 0.15s;
  }
  .glove-toggle:hover { color: #FFFFFF; border-color: rgba(255,255,255,0.22); }
  .glove-toggle[aria-pressed="true"] {
    color: var(--brand-dark); background: var(--lime); border-color: var(--lime);
    font-weight: 650;
  }

  .lang-row {
    display: inline-flex; margin: 0;
    border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; overflow: hidden;
  }
  .lang-btn {
    min-width: 36px; padding: 6px 9px; border: none;
    border-right: 1px solid rgba(255,255,255,0.18);
    background: transparent; color: rgba(255,255,255,0.72);
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.3px;
    font-family: inherit; cursor: pointer; transition: all 0.15s;
  }
  .lang-btn:last-child { border-right: none; }
  .lang-btn:hover { color: #FFFFFF; background: rgba(255,255,255,0.08); }
  .lang-btn[aria-pressed="true"] { background: #FFFFFF; color: var(--brand); }

  /* ───────────────────────────── layout ───────────────────────────── */

  /*
   * Wide enough for the dish grid to use a desktop screen, with the narrow
   * controls held to a readable width inside it. Stretching a date field across
   * 1200px is not "using the space", it is just a long date field.
   */
  .content {
    width: 100%; max-width: 1280px; margin: 0 auto;
    padding: 4px 20px calc(var(--bar-h) + 28px);
    animation: contentIn 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes contentIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .date-pill,
  .time-row,
  .role-tabs,
  #comment,
  .rate-line { max-width: 620px; }

  .section-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted);
    margin: 28px 0 10px; display: flex; align-items: center; gap: 10px;
    text-shadow: none;
  }
  .section-label::after {
    content: ''; flex: 1; height: 1px; background: var(--line);
  }

  /* ───────────────────────────── date ───────────────────────────── */

  .date-pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0 14px; height: 52px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .date-pill:hover { border-color: var(--line-2); }
  .date-pill:focus-within {
    border-color: var(--brand-mid); box-shadow: 0 0 0 3px rgba(17,96,68,0.12);
  }
  .date-pill .icon { font-size: 16px; opacity: 0.75; line-height: 1; }
  input[type="date"] {
    background: none; border: none; color: var(--ink);
    font-size: 16px; font-weight: 600; font-family: inherit; flex: 1;
    outline: none; cursor: pointer; color-scheme: light; padding: 0;
  }
  /* The old rule inverted the picker glyph to make it visible on dark. On a
     white field the browser's own colour is correct, so nothing is applied. */
  input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.55; }
  input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

  /* ───────────────────────── employee chips ───────────────────────── */

  /*
   * Still a horizontal rail on a phone, where thumb-scrolling a single row is
   * faster than hunting a wrapped grid. On a desktop it wraps, because a row
   * that scrolls sideways on a 27-inch monitor hides half the team for no reason.
   */
  .emp-scroll {
    display: flex; gap: 10px; overflow-x: auto;
    padding: 2px 2px 8px; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .emp-scroll::-webkit-scrollbar { display: none; }

  .emp-chip {
    flex-shrink: 0; scroll-snap-align: start;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
    padding: 8px 14px 8px 8px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    position: relative; min-width: 0;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .emp-chip:hover { border-color: var(--line-2); background: var(--card-2); }
  .emp-chip .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: var(--brand-soft); border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--brand);
    letter-spacing: 0.01em; transition: background 0.15s, color 0.15s;
  }
  .emp-chip .emp-name {
    font-size: 14px; font-weight: 600; color: var(--ink-2);
    white-space: nowrap; transition: color 0.15s;
  }
  .emp-chip.checked {
    border-color: var(--brand); background: var(--brand);
    box-shadow: var(--shadow);
  }
  .emp-chip.checked .avatar { background: var(--lime); color: var(--brand-dark); }
  .emp-chip.checked .emp-name { color: #FFFFFF; font-weight: 650; }
  .check-badge { display: none !important; }   /* the filled chip is the state */

  .emp-chip.disabled { opacity: 0.4; pointer-events: none; filter: none; }

  /* ───────────────────────────── dishes ─────────────────────────────
   *
   * Rows, not cards, and that is a usability decision rather than a taste one.
   *
   * The card grid that preceded this looked better in a screenshot and was worse
   * to work with. Measured on the live app: a 390px phone in glove mode showed
   * ONE dish at a time and ran to sixteen screens for a twenty-four dish menu,
   * because each card was 390px tall and 42% of it was a photograph. A cook in
   * gloves at 22:00 was scrolling, not counting.
   *
   * A row is about 60px. The same menu is one desktop screen and two phone
   * screens, and glove mode still shows ten at once.
   *
   * The order of things across the row follows the order of the job: the letter
   * on the sticker in your hand, the photo that confirms it, the name, what you
   * have counted so far, and the two buttons you press. Waste sits last because
   * it is the exception, not the task.
   *
   * Every element below is placed with grid-column on the markup the script
   * already builds. Nothing was added, removed or reordered in the DOM.
   */

  .dishes {
    display: flex; flex-direction: column; gap: 0;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .dish {
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr) auto auto auto;
    align-items: center;
    column-gap: 10px;
    padding: 8px 12px;
    background: var(--card);
    border: none; border-bottom: 1px solid var(--line);
    border-radius: 0;
    text-align: left;
    box-shadow: none;
    cursor: pointer;
    position: relative;
    transition: background 0.12s;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .dish:last-child { border-bottom: none; }
  .dish:hover { background: var(--brand-softer); }
  .dish::before { display: none; }

  /* The letter is the primary key: it is what is printed on the sticker and it
     is what someone is scanning the list for. It was 12.5px in the card version,
     smaller than the count. */
  .dish .letter {
    grid-column: 1; grid-row: 1;
    margin: 0; padding: 0 6px;
    min-width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; background: var(--brand-soft); color: var(--brand);
    font-size: 16px; font-weight: 750; line-height: 1; letter-spacing: 0;
    transition: background 0.12s, color 0.12s;
  }

  .dish-img {
    grid-column: 2; grid-row: 1;
    width: 38px; height: 38px; aspect-ratio: auto;
    object-fit: cover; border-radius: 8px;
    margin: 0; display: block; background: var(--brand-soft);
  }

  .dish .dish-name {
    grid-column: 3; grid-row: 1; align-self: center;
    margin: 0;
    font-size: 14px; font-weight: 550; color: var(--ink);
    line-height: 1.25; min-height: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .dish input[type="number"] {
    grid-column: 4; grid-row: 1;
    width: 54px; margin: 0;
    padding: 7px 2px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card-2);
    color: var(--ink);
    font-size: 18px; font-weight: 700; font-family: inherit;
    text-align: center; letter-spacing: -0.01em;
    outline: none; transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
    -webkit-appearance: none; pointer-events: none;
  }
  .dish input[type="number"]::placeholder { color: var(--faint); font-weight: 600; }
  .dish input[type="number"]:focus,
  .dish.editing input[type="number"] {
    border-color: var(--brand-mid); background: #FFFFFF;
    box-shadow: 0 0 0 3px rgba(17,96,68,0.12);
    pointer-events: auto;
  }
  .dish input[type="number"]::-webkit-inner-spin-button,
  .dish input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .bump { grid-column: 5; grid-row: 1; display: flex; gap: 6px; margin: 0; }
  .bump-btn {
    flex: none; width: 48px; min-height: 44px; border-radius: 8px;
    border: 1px solid var(--line-2); background: var(--card);
    color: var(--brand); font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; padding: 0;
    transition: background 0.1s, border-color 0.1s, transform 0.06s;
    touch-action: manipulation;
  }
  .bump-btn:hover { background: var(--brand-soft); border-color: var(--brand-mid); }
  .bump-btn:active { transform: scale(0.94); background: var(--lime); border-color: var(--lime-deep); color: var(--brand-dark); }

  /* Waste keeps its own box at the end of the row, quiet until it is not zero. */
  .waste-row {
    grid-column: 6; grid-row: 1;
    display: flex; align-items: center; gap: 6px;
    margin: 0; padding: 0; border-top: none;
  }
  .waste-lab {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--faint); flex-shrink: 0;
  }
  .waste-inp {
    width: 44px; flex: none; height: 36px; padding: 0 4px;
    border-radius: 8px; border: 1px dashed var(--line-2);
    background: transparent; color: var(--ink-2);
    font-size: 14px; font-weight: 650; font-family: inherit; text-align: center;
    outline: none; -webkit-appearance: none;
    transition: border-color 0.12s, background 0.12s, color 0.12s;
  }
  .waste-inp::placeholder { color: var(--faint); font-weight: 500; }
  .waste-inp::-webkit-inner-spin-button, .waste-inp::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .waste-inp:focus { border-style: solid; border-color: var(--danger); box-shadow: 0 0 0 3px rgba(179,38,30,0.12); }

  /* A counted row is marked on its left edge and in its letter, which reads down
     a long list far faster than a tinted background does. */
  .dish.has-value { background: #FFFFFF; box-shadow: inset 4px 0 0 var(--lime-deep); }
  .dish.has-value:hover { background: var(--brand-softer); }
  .dish.has-value .letter { background: var(--lime); color: var(--brand-dark); }
  .dish.has-value .dish-name { font-weight: 650; }
  .dish.has-value input[type="number"] { border-color: var(--lime-deep); color: var(--brand); background: #FFFFFF; }

  .dish.has-waste .waste-inp {
    border-style: solid; border-color: var(--danger-line);
    background: var(--danger-bg); color: var(--danger);
  }
  .dish.has-waste .waste-lab { color: var(--danger); }

  /* Two columns of rows once the screen is wide enough to hold them, which puts
     a whole menu on one screen without making any row shorter. */
  @media (min-width: 1080px) {
    .dishes {
      display: grid; grid-template-columns: 1fr 1fr;
      column-gap: 0; align-items: start;
    }
    .dish:nth-child(odd) { border-right: 1px solid var(--line); }
    /* The last row of a two-column grid should not draw a floor under itself. */
    .dish:nth-last-child(-n+2) { border-bottom: none; }
    .dish:nth-child(odd):last-child { border-right: none; }
  }

  /* ──────────────────────── hours, role, comment ──────────────────────── */

  .time-row { display: flex; gap: 12px; }
  .time-pill {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0 14px; height: 52px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .time-pill:hover { border-color: var(--line-2); }
  .time-pill:focus-within { border-color: var(--brand-mid); box-shadow: 0 0 0 3px rgba(17,96,68,0.12); }
  .time-pill label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); flex-shrink: 0;
  }
  input[type="time"] {
    background: none; border: none; color: var(--ink);
    font-size: 16px; font-weight: 650; flex: 1; min-width: 0;
    outline: none; cursor: pointer; color-scheme: light; font-family: inherit; padding: 0;
  }
  input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.55; }
  input[type="time"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

  .rate-line {
    min-height: 0; font-size: 13px; font-weight: 600; color: var(--lime-ink);
    margin-top: 10px; letter-spacing: 0;
  }
  .rate-line.warn { color: var(--warn); }

  .role-tabs {
    display: flex; gap: 0;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 4px; box-shadow: var(--shadow-sm);
  }
  .role-tab {
    flex: 1; padding: 11px 8px; border-radius: var(--radius-sm);
    border: none; background: transparent;
    color: var(--muted); font-size: 14px; font-weight: 600;
    text-align: center; cursor: pointer; transition: all 0.15s; user-select: none;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .role-tab:hover { color: var(--ink); background: var(--brand-softer); }
  .role-tab.active {
    background: var(--brand); color: #FFFFFF; font-weight: 650;
    box-shadow: var(--shadow-sm);
  }
  .role-tabs.disabled { opacity: 0.45; pointer-events: none; }

  textarea {
    width: 100%; padding: 12px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-size: 15px; resize: none;
    min-height: 72px; outline: none; font-family: inherit; line-height: 1.5;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  textarea:focus { border-color: var(--brand-mid); box-shadow: 0 0 0 3px rgba(17,96,68,0.12); }
  textarea::placeholder { color: var(--faint); }

  /* ──────────────────────────── messages ──────────────────────────── */

  .error-msg {
    display: none; margin-top: 14px; max-width: 620px;
    background: var(--danger-bg); color: var(--danger);
    border: 1px solid var(--danger-line);
    border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: 14px; font-weight: 550; line-height: 1.5;
  }
  .error-msg.visible { display: block; }

  .queue-banner, .dupe-banner { display: none; }
  .queue-banner.visible, .dupe-banner.visible {
    display: block; margin: 16px 0 0;
    background: var(--warn-bg); color: var(--warn);
    border: 1px solid var(--warn-line);
    border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: 13.5px; font-weight: 550; line-height: 1.5;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.3s ease; }

  /* ─────────────────────────── submit bar ─────────────────────────── */

  /*
   * One row, not two. The total and the action sit side by side on a white bar
   * with a hairline above it, which is about half the height of the old stacked
   * version and stops the footer eating the bottom row of tiles.
   */
  .submit-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    padding: 12px max(20px, calc((100% - 1280px) / 2)) calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 16px;
  }
  .submit-total {
    font-size: 13px; font-weight: 650; letter-spacing: 0.02em;
    text-transform: none; color: var(--ink-2);
    text-align: left; margin: 0; min-height: 0; flex: 1; min-width: 0;
  }
  #submitBtn {
    width: auto; min-width: 190px; flex-shrink: 0;
    padding: 14px 32px; border-radius: var(--radius); border: none;
    background: var(--brand); color: #FFFFFF;
    font-size: 16px; font-weight: 650; letter-spacing: 0; cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, transform 0.06s;
    box-shadow: var(--shadow);
  }
  #submitBtn:hover:not(:disabled) { background: var(--brand-mid); transform: none; box-shadow: var(--shadow); }
  #submitBtn:active:not(:disabled) { transform: scale(0.985); }
  #submitBtn:disabled { background: var(--line-2); color: #FFFFFF; box-shadow: none; cursor: not-allowed; }

  /* ──────────────────────────── success ──────────────────────────── */

  .success-screen {
    display: none; min-height: calc(100vh - 56px);
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 24px;
    animation: fadeUp 0.3s ease;
  }
  .success-screen.visible { display: flex; }
  @keyframes fadeUp {
    from { transform: translateY(8px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .success-ring {
    width: 76px; height: 76px; border-radius: 50%; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; color: #FFFFFF;
    background: var(--brand);
    box-shadow: none;
    animation: fadeUp 0.3s ease;
  }
  .success-title { font-size: 26px; font-weight: 700; color: var(--ink); margin-bottom: 10px; letter-spacing: -0.015em; }
  .success-detail {
    font-size: 14px; color: var(--muted); line-height: 1.9;
    max-width: 380px; margin: 0 auto 30px;
  }
  .success-detail span {
    display: inline-block; background: var(--brand-softer);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 3px 9px; margin: 3px; font-size: 13px; font-weight: 550; color: var(--ink-2);
  }
  .btn-again {
    padding: 14px 32px; border-radius: var(--radius); border: none;
    background: var(--brand); color: #FFFFFF;
    font-size: 16px; font-weight: 650; cursor: pointer; font-family: inherit;
    box-shadow: var(--shadow); transition: background 0.15s;
  }
  .btn-again:hover { background: var(--brand-mid); transform: none; box-shadow: var(--shadow); }

  .undo-wrap { margin-top: 20px; min-height: 44px; }
  .btn-undo {
    padding: 12px 24px; border-radius: var(--radius);
    border: 1px solid var(--danger-line);
    background: var(--danger-bg); color: var(--danger);
    font-size: 14px; font-weight: 650; cursor: pointer; font-family: inherit;
  }
  .btn-undo:hover { background: #FBDFDC; }
  .btn-undo:disabled { opacity: 0.5; cursor: default; }

  /* Queued, not saved. Amber throughout so it can never be mistaken for the
     green confirmation, which is the whole reason these classes exist. */
  .success-ring.queued { background: var(--warn); box-shadow: none; font-size: 32px; }
  .success-title.queued { color: var(--warn); font-size: 24px; }

  /* ─────────────────────────── glove mode ───────────────────────────
     Deliberately not just "bigger". Fewer, larger tiles and larger targets,
     with the same information and the same controls. */

  /* Taller rows and bigger targets, not a different layout. The old glove mode
     turned the grid into huge cards and left one dish on a phone screen. */
  body.glove .dish { padding: 11px 14px; column-gap: 12px; }
  body.glove .dish .letter { height: 42px; min-width: 42px; font-size: 20px; border-radius: 10px; }
  body.glove .dish-img { width: 48px; height: 48px; }
  body.glove .dish .dish-name { font-size: 16px; -webkit-line-clamp: 2; }
  body.glove .dish input[type="number"] { width: 64px; font-size: 22px; padding: 11px 2px; }
  body.glove .bump-btn { width: 58px; min-height: 56px; font-size: 17px; }
  body.glove .waste-lab { font-size: 11px; }
  body.glove .waste-inp { width: 52px; height: 48px; font-size: 16px; }
  body.glove .emp-chip { padding: 10px 18px 10px 10px; }
  body.glove .emp-chip .avatar { width: 44px; height: 44px; font-size: 16px; }
  body.glove .emp-chip .emp-name { font-size: 16px; }
  body.glove .role-tab { padding: 16px 10px; font-size: 16px; }
  body.glove .date-pill, body.glove .time-pill { height: 60px; }
  body.glove input[type="date"], body.glove input[type="time"] { font-size: 18px; }
  body.glove #submitBtn { padding: 18px 36px; font-size: 18px; min-width: 220px; }
  body.glove { --bar-h: 86px; }

  /* ─────────────────────────── responsive ───────────────────────────
     One breakpoint set, driven by what actually breaks rather than by device
     names. The dish grid needs none of them: auto-fill handles it. */

  @media (max-width: 860px) {
    .app-header { gap: 12px; padding: 9px 16px; padding-top: calc(9px + env(safe-area-inset-top)); }
    .header-right { gap: 4px 12px; }
    .header-title { font-size: 13px; }
    .content { padding-left: 16px; padding-right: 16px; }
    .submit-bar { padding-left: 16px; padding-right: 16px; }
    .submit-bar { padding-left: max(16px, calc((100% - 1280px) / 2)); padding-right: max(16px, calc((100% - 1280px) / 2)); }
  }

  @media (max-width: 560px) {
    /*
     * The header stops wrapping to a second row, which was costing 20px of a
     * phone screen that the dish grid wants. The date comes out rather than the
     * navigation, because the date field is the next thing down the page and
     * says the same thing in a place you can actually change it.
     */
    .header-title { width: auto; margin-right: auto; }
    .header-date { display: none; }
    /*
     * Two lines on a phone, and this is the honest answer rather than a
     * compromise. On one line at 390px the fixed columns ate everything and the
     * dish name was left about 30px, so it rendered as "Garc Gr…" and "Test &…".
     * A name truncated to four characters identifies nothing, and in glove mode
     * the waste box was pushed off the row altogether.
     *
     * So the name gets a line of its own with the letter and the photo, and the
     * controls get the line below. A row is about 95px instead of 60, which is
     * still a quarter of the 390px card this replaced, and every part of it is
     * legible and reachable.
     */
    .dish {
      padding: 7px 12px;
      grid-template-columns: 32px 36px minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      column-gap: 8px; row-gap: 6px;
      align-items: center;
    }
    .waste-lab { display: none; }

    .dish .letter   { grid-area: 1 / 1 / 2 / 2; min-width: 32px; height: 32px; font-size: 16px; }
    .dish-img       { grid-area: 1 / 2 / 2 / 3; width: 36px; height: 36px; }
    .dish .dish-name{ grid-area: 1 / 3 / 2 / 5; font-size: 14px; -webkit-line-clamp: 2; }

    /* The count sits under the letter and photo it belongs to. */
    .dish input[type="number"] { grid-area: 2 / 1 / 3 / 3; width: 100%; font-size: 19px; padding: 8px 2px; }
    .bump      { grid-area: 2 / 3 / 3 / 4; justify-self: start; }
    .waste-row { grid-area: 2 / 4 / 3 / 5; justify-self: end; }
    .bump-btn  { width: 52px; font-size: 14px; }
    .waste-inp { width: 46px; height: 40px; }

    body.glove .dish { padding: 11px 12px; row-gap: 10px; }
    body.glove .dish .letter { min-width: 42px; height: 42px; }
    body.glove .dish-img { width: 44px; height: 44px; }
    body.glove .dish .dish-name { font-size: 16px; }
    body.glove .dish input[type="number"] { font-size: 22px; padding: 12px 2px; }
    body.glove .bump-btn { width: 60px; min-height: 52px; font-size: 16px; }
    body.glove .waste-inp { width: 54px; height: 52px; }
    body.glove .waste-lab { display: none; }
    .time-row { flex-direction: column; }
    #submitBtn { min-width: 0; flex: 1; padding: 14px 20px; }
    .submit-total { flex: 0 1 auto; font-size: 12.5px; }
    :root { --bar-h: 72px; }
  }

  @media (min-width: 1100px) {
    /* Side by side once there is room for both to stay comfortable. */
    .time-row { max-width: 620px; }
    .emp-scroll { flex-wrap: wrap; overflow-x: visible; scroll-snap-type: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

</style>

<script>
/* ---------------------------------------------------------------------------
 * Local dish thumbnails (see tools/make-thumbs.sh).
 *
 * DISH_IMAGES points at full-resolution S3 images (~1.5 MB each, ~35 MB for a
 * week of 24 dishes) that we render into ~80px tiles on kitchen phones. The
 * script pre-builds ~13 kB WebP thumbs under thumbs/ and rewrites the manifest
 * line below, which lists every uuid that has a committed thumb.
 *
 * KEYED BY THE S3 IMAGE UUID, NEVER BY DISH LETTER: the weekly scheduled task
 * reassigns letters to different dishes, so a letter-keyed thumb would silently
 * show the WRONG photo. A uuid that is not in the manifest simply has no thumb
 * yet, and we request the original S3 URL instead: slower, but always right,
 * and with no wasted 404. Do not hand-edit the manifest line; re-run the script
 * after the weekly task swaps the dishes and commit thumbs/ + index.html

 * ------------------------------------------------------------------------- */

// Relative path on purpose: "/thumbs/..." would resolve to the domain root and
// always 404 on a project Pages site. Lowercased because Pages is
// case-sensitive while macOS (which runs the generator) is not.
// Keep this extraction rule identical to the one in tools/make-thumbs.sh:
// the uuid is the path segment right after /ProductImages/, not the filename.
function thumbPathFor(url) {
  const known = (typeof THUMB_UUIDS === "object" && THUMB_UUIDS) ? THUMB_UUIDS : {};
  const m = /\/ProductImages\/([0-9a-f-]{8,64})\//i.exec(url || "");
  if (!m) return "";
  const uuid = m[1].toLowerCase();
  return known[uuid] ? "thumbs/" + uuid + ".webp" : "";
}

// The EMPLOYEES array above is maintained by the weekly task and is the offline
// baseline. If the sheet has a Roster tab it wins, so a new hire can work their
// first shift without waiting for a deploy. An EMPTY response never wins: that
// would leave nobody able to submit.
// The old backend could not process a retraction at all, so undo had to be probed for
// and stayed hidden until a reply proved otherwise. The current API handles it, so
// there is nothing to probe and the button is simply there.

async function refreshRosterFromServer() {
  let names = null;
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch(API_URL + "?view=roster", { redirect: "follow", signal: ctrl.signal });
    clearTimeout(t);
    if (res.ok) {
      const j = JSON.parse(await res.text());
      if (j && Array.isArray(j.employees) && j.employees.length) names = j.employees;
    }
  } catch (e) { return; }              // not deployed, offline, or slow: keep the baseline
  if (!names) return;

  const current = [...empBox.querySelectorAll(".emp-chip")].map(c => c.dataset.name);
  if (names.length === current.length && names.every((n, i) => n === current[i])) return;

  // Never rebuild under someone mid-entry: they would lose their selection, and
  // on a phone the chips would move under a thumb already on the way down.
  if (empBox.querySelector(".emp-chip.checked")) return;

  empBox.innerHTML = "";
  names.forEach(addEmployeeChip);
}

const empBox = document.getElementById("employees");
function addEmployeeChip(name) {
  const chip = document.createElement("div");
  chip.className = "emp-chip";
  chip.dataset.name = name;
  // Names now arrive from the sheet as well as this file, so they are escaped.
  chip.innerHTML = '<div class="check-badge">&#10003;</div><div class="avatar">'
    + escapeHtml(name.slice(0,2).toUpperCase()) + '</div><div class="emp-name">'
    + escapeHtml(name) + '</div>';
  chip.addEventListener("click", () => {
    if (chip.classList.contains("disabled")) return;
    if (chip.classList.contains("checked")) {
      chip.classList.remove("checked");
      empBox.querySelectorAll(".emp-chip").forEach(c => c.classList.remove("disabled"));
      setRolesEnabled(false);
    } else if (!empBox.querySelector(".emp-chip.checked")) {
      chip.classList.add("checked");
      empBox.querySelectorAll(".emp-chip").forEach(c => { if (c !== chip) c.classList.add("disabled"); });
      setRolesEnabled(true);
    }
    saveDraft();
    updateDupeBanner();   // the warning is per person, so it moves with the chip
  });
  empBox.appendChild(chip);
}

EMPLOYEES.forEach(addEmployeeChip);

// Dish names are written into this file by the weekly task and already contain
// "&" ("Turkish Chickpeas & Spinach Tomato Stew", "Test&Tell: ..."). Anything
// interpolated into innerHTML gets escaped rather than trusted.
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Dish names run long ("Test&Tell: High-Protien Thai Peanut Bowl with Chickpea &
// Tofu"). Trim for the confirmation chips, and fall back to the letter if the
// weekly task ever leaves a name blank.
function shortDish(name, letter) {
  const n = String(name || "").trim();
  if (!n) return letter;
  return n.length > 30 ? n.slice(0, 29).trimEnd() + "…" : n;
}

// Idempotency id. crypto.randomUUID is not available on older kitchen phones or
// over plain http, so fall back to random bytes and finally to Math.random.
function newEntryId() {
  try {
    if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
    if (window.crypto && crypto.getRandomValues) {
      const a = new Uint8Array(16); crypto.getRandomValues(a);
      return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { /* fall through */ }
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

// Whole non-negative counts only: 0 for empty, NaN for anything else.
function parseCount(value) {
  const raw = String(value == null ? "" : value).trim();
  if (raw === "") return 0;
  if (!/^\d+$/.test(raw)) return NaN;
  return parseInt(raw, 10);
}

const dishBox = document.getElementById("dishes");

/*
 * Built in a function rather than inline, so the grid can be rebuilt when the
 * server says the week's letters mean something else. Everything inside is
 * exactly as it was.
 */
function buildDishTiles() {
  dishBox.innerHTML = "";
  DISH_LETTERS.forEach(letter => {
  const div = document.createElement("div");
  div.className = "dish";
  div.id = "tile_"+letter;
  // +1 / +10 rather than a keyboard. Staff assemble in nitrile gloves, where a
  // numeric keypad is slow and mis-taps are common; a stray digit inside one tile
  // is also the mistake nobody spots. Typing still works for anyone who prefers it.
  div.innerHTML =
    '<div class="letter">'+letter+'</div>'
    + '<div class="dish-name">'+escapeHtml(DISH_NAMES[letter]||"")+'</div>'
    + '<input type="number" min="0" max="'+MAX_PER_DISH+'" step="1" inputmode="numeric" placeholder="0" id="dish_'+letter+'">'
    + '<div class="bump">'
    +   '<button type="button" class="bump-btn" data-d="1"  aria-label="Add 1 '+escapeHtml(DISH_NAMES[letter]||letter)+'">+1</button>'
    +   '<button type="button" class="bump-btn" data-d="10" aria-label="Add 10 '+escapeHtml(DISH_NAMES[letter]||letter)+'">+10</button>'
    + '</div>'
    + '<div class="waste-row">'
    +   '<label class="waste-lab" for="waste_'+letter+'">waste</label>'
    +   '<input type="number" min="0" max="'+MAX_PER_DISH+'" step="1" inputmode="numeric" placeholder="0" id="waste_'+letter+'" class="waste-inp">'
    + '</div>';
  const imgUrl = DISH_IMAGES[letter];
  if (imgUrl) {
    const thumb = thumbPathFor(imgUrl);
    const img = document.createElement("img");  // built as a DOM node, never as
    img.className = "dish-img";                 // an innerHTML string: no quoting
    img.alt = "";                               // surface for URLs or names.
    img.loading = "lazy";
    img.decoding = "async";
    // Single-shot fallback. this.onerror = null FIRST makes a loop impossible:
    // the handler fires at most once per <img>, and only ever swaps the local
    // thumb for the original S3 URL. It never points back at the thumb.
    img.onerror = function () {
      this.onerror = null;
      if (thumb && this.src !== imgUrl) this.src = imgUrl;
    };
    img.src = thumb || imgUrl;                  // handler attached BEFORE src
    div.insertBefore(img, div.firstChild);      // image stays above .letter
  }
  // By id, not querySelector("input"): the tile now holds a waste input too, and
  // "the first input" is exactly the kind of assumption that breaks silently.
  const inp = document.getElementById("dish_"+letter) || div.querySelector("#dish_"+letter);
  const wasteInp = div.querySelector(".waste-inp");

  function refreshTile() {
    div.classList.toggle("has-value", parseCount(inp.value) > 0);
    div.classList.toggle("has-waste", parseCount(wasteInp.value) > 0);
    updateTotal();
    updateRate();       // dishes/hour depends on the total, so it moves with it
    saveDraft();
  }
  inp.addEventListener("input", refreshTile);
  wasteInp.addEventListener("input", refreshTile);

  div.querySelectorAll(".bump-btn").forEach(b => {
    b.addEventListener("click", (e) => {
      e.stopPropagation();          // do not let the tile grab focus for typing
      const cur = parseCount(inp.value);
      const base = isNaN(cur) ? 0 : cur;
      const next = Math.min(base + Number(b.dataset.d), MAX_PER_DISH);
      inp.value = String(next);
      refreshTile();
    });
  });

  // Tapping the tile still opens the keyboard, but not when the tap landed on a
  // control that has its own behaviour.
  div.addEventListener("click", (e) => {
    if (e.target === inp || e.target === wasteInp) return;
    if (e.target.closest && e.target.closest(".bump, .waste-row")) return;
    div.classList.add("editing");
    inp.style.pointerEvents = "auto";
    inp.focus();
    inp.select();
  });
  inp.addEventListener("blur", () => {
    div.classList.remove("editing");
    inp.style.pointerEvents = "none";
  });
  inp.addEventListener("focus", () => {
    div.classList.add("editing");
    inp.style.pointerEvents = "auto";
  });
  dishBox.appendChild(div);
  });
}
buildDishTiles();

/*
 * The week's letters, from the same menu the stickers are printed from.
 *
 * The list in this file is written by a weekly task. The week that task does not
 * run, every letter still points at last week's dish, and because an entry stores
 * the dish NAME the whole week is then recorded against food nobody cooked. So
 * the app asks the server what the letters mean today, and keeps the baked list
 * only for a phone with no signal.
 *
 * It will not touch the grid once anyone has typed into it. Replacing tiles under
 * someone mid-shift would lose their counts, and a stale name is a smaller
 * problem than a lost count.
 */
function gridIsUntouched() {
  if (dishBox.contains(document.activeElement)) return false;
  return ![...dishBox.querySelectorAll("input[type=number]")].some(i => i.value !== "");
}

async function refreshMenuFromServer() {
  let data = null;
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch(API_URL + "?view=menu&date="
                            + encodeURIComponent(document.getElementById("date").value || ""),
                            { signal: ctrl.signal, headers: { "Authorization": "Bearer " + INGEST_TOKEN } });
    clearTimeout(t);
    if (!res.ok) return;
    data = JSON.parse(await res.text());
  } catch (e) { return; }            // offline, slow, or refused: keep the baked list

  const letters = data && data.letters;
  // An empty week is reported as empty. Blanking the grid over a menu nobody has
  // published yet would be worse than showing last week's.
  if (!letters || !Object.keys(letters).length) return;
  if (!gridIsUntouched()) return;

  const names = {}, images = {};
  Object.keys(letters).sort().forEach(L => {
    names[L] = letters[L].name || "";
    if (letters[L].image) images[L] = letters[L].image;
  });
  // Nothing to do when the server agrees with what is already on screen, which
  // is the normal case and must not cost a rebuild on every load.
  const incoming = Object.keys(names).sort();
  if (dishSignature() === incoming.map(l => l+"="+names[l]).join("|")) return;

  DISH_NAMES = names;
  DISH_IMAGES = images;
  DISH_LETTERS = Object.keys(names);
  buildDishTiles();
  updateTotal();
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = msg;
  el.classList.add("visible");
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
  setTimeout(() => el.classList.remove("shake"), 400);
}
function clearError() { document.getElementById("errorMsg").classList.remove("visible"); }

function submitForm() {
  clearError();
  const date = document.getElementById("date").value;
  const comment = document.getElementById("comment").value.trim();
  const selectedEmployees = [...document.querySelectorAll(".emp-chip.checked")].map(c => c.dataset.name);
  let dishes = [];
  let items = [];
  let notWhole = "";
  let tooMany = "";
  let totalWaste = 0;
  for (const l of DISH_LETTERS) {
    const inp = document.getElementById("dish_"+l);
    if (!inp) continue;
    const qty = parseCount(inp.value);
    const wasteEl = document.getElementById("waste_"+l);
    const waste = wasteEl ? parseCount(wasteEl.value) : 0;
    if (isNaN(qty)) { notWhole = l; break; }
    if (qty > MAX_PER_DISH) { tooMany = l; break; }
    if (isNaN(waste)) { notWhole = l; break; }
    if (waste > MAX_PER_DISH) { tooMany = l; break; }
    totalWaste += (waste > 0 ? waste : 0);
    // Waste with no assembled count is legitimate -- a tray dropped before any
    // of that dish was finished -- so it must produce an item row on its own.
    if (qty <= 0 && waste > 0) {
      items.push({ letter: l, dish: DISH_NAMES[l] || "", qty: 0, waste: waste });
    }
    if (qty > 0) {
      dishes.push(l+":"+qty);
      // The letter alone is not a durable identifier: the weekly task reassigns
      // letters, so "A:12" cannot be interpreted after the menu rotates. Send the
      // dish NAME with every count so history stays readable forever.
      items.push({ letter: l, dish: DISH_NAMES[l] || "", qty: qty, waste: (waste > 0 ? waste : 0) });
    }
  }
  // showError writes to textContent, so these must be real characters, not HTML
  // entities. Written as \uXXXX escapes to keep every byte of this file ASCII.
  if (!date) { showError("\u26A0\uFE0F " + t("errDate")); return; }
  if (selectedEmployees.length !== 1) { showError("\u26A0\uFE0F " + t("errName")); return; }
  if (notWhole) { showError("\u26A0\uFE0F " + t("dish").replace(/^./, c=>c.toUpperCase()) + " " + notWhole + ": " + t("errWhole")); return; }
  if (tooMany) { showError("\u26A0\uFE0F " + t("dish").replace(/^./, c=>c.toUpperCase()) + " " + tooMany + ": " + t("errMax") + " " + MAX_PER_DISH + " \u2014 " + t("errCheck")); return; }
  // items can be non-empty with dishes empty: a waste-only entry. That is a valid
  // thing to record, so gate on items rather than on assembled counts.
  if (!items.length) { showError("\u26A0\uFE0F " + t("errOneDish")); return; }

  const roles = getSelectedRoles();
  if (!roles.length) { showError("\u26A0\uFE0F " + t("errRole")); return; }
  const rolesStr = roles.join(", ");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = t("saving");

  // One id per attempt, reused across retries of THAT attempt, so a double tap or
  // a retry after an ambiguous failure cannot append the same shift twice. Held on
  // the button so a genuinely new entry always gets a fresh id.
  if (!btn.dataset.entryId) btn.dataset.entryId = newEntryId();

  // Built once and held, so the offline path can queue the exact same bytes --
  // including the entryId, which is what makes a later retry safe.
  const payload = {
    // `dishes` stays exactly as before so the existing sheet and every report
    // built on it keep working untouched. `items` is additive.
    date, employees: selectedEmployees, dishes: dishes.join(" | "),
    role: rolesStr, comment,
    items: items,
    totalWaste: totalWaste,
    startTime: document.getElementById("startTime").value || "",
    endTime: document.getElementById("endTime").value || "",
    shiftMinutes: shiftMinutes(),
    token: INGEST_TOKEN,
    entryId: btn.dataset.entryId,
    clientTime: new Date().toISOString(),
    tz: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } })(),
    appVersion: APP_VERSION
  };

  fetch(API_URL, {
    method: "POST",
    redirect: "follow",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  })
  .then(async (res) => {
    if (!res.ok) throw new Error("server said HTTP "+res.status);
    const body = await res.text();
    if (looksLikeSaveFailure(body)) throw new Error("rejected the entry, " + firstError(body));
    clearDraft();
    noteSent(date, selectedEmployees[0], currentTotal(), payload.entryId);
    armUndo(payload);
    // Saved, so the next submit is a genuinely different entry and must not reuse
    // this id -- otherwise the server would dedupe a real second shift away.
    delete btn.dataset.entryId;
    // Show dish NAMES back to staff, not letters: "A:12" is meaningless to read,
    // and it is the confirmation they use to spot a mis-tap.
    document.getElementById("successDetail").innerHTML =
      escapeHtml(date)+"<br>"+selectedEmployees.map(n=>"<span>"+escapeHtml(n)+"</span>").join(' ')
      +"<br>"+items.map(it => "<span>"+escapeHtml(shortDish(it.dish, it.letter))+" &times;"+it.qty+"</span>").join(' ')
      +"<br><span>"+escapeHtml(rolesStr)+"</span>";
    document.getElementById("formSection").style.display = "none";
    document.getElementById("submitBar").style.display = "none";
    document.getElementById("successScreen").classList.add("visible");
  })
  .catch(err => {
    // Queue nearly everything now, which the new backend is what makes safe: it
    // upserts on entryId, so sending the same entry twice updates one shift instead
    // of writing two. Under the old sheet a replay could double-record, which is why
    // a server error used to be left on screen for somebody to retype by hand. The
    // one case still worth keeping on screen is the server saying this entry is
    // malformed, because retrying it unchanged cannot fix it.
    if (!err || !/rejected the entry/.test(err.message || "")) {
      queueEntry(payload);
      clearDraft();
      delete btn.dataset.entryId;
      showQueued(date, selectedEmployees, items, rolesStr);
      return;
    }
    showError("\u274C NOT saved \u2014 " + err.message + ". Your numbers are still on screen: check them and tap Submit Entry again. If it keeps failing, tell your shift leader before closing this page.");
    btn.disabled = false; btn.textContent = t("submit");
  });
}

// --- Undo -------------------------------------------------------------------
// There is no edit path at all, so a mis-tapped submit is permanent. A short
// window to retract one is cheap and removes the worst consequence of a mistake.
//
// It marks the entry void rather than deleting rows: an append-only log is what
// makes the sheet trustworthy, and a silent delete would let numbers change under
// anyone who had already read them.
let undoState = null;
let undoTimer = null;
const UNDO_SECONDS = 60;

function armUndo(payload) {
  // Always armed. The old backend could not process a retraction, so this used to be
  // withheld until a probe proved otherwise. The current one can, so it is simply here.
  undoState = { payload: payload, expires: Date.now() + UNDO_SECONDS * 1000 };
  const btn = document.getElementById("undoBtn");
  if (!btn) return;
  btn.hidden = false;
  btn.disabled = false;
  if (undoTimer) clearInterval(undoTimer);
  const tick = () => {
    if (!undoState) return;
    const left = Math.ceil((undoState.expires - Date.now()) / 1000);
    if (left <= 0) { disarmUndo(); return; }
    btn.textContent = t("undo") + " (" + left + "s)";
  };
  tick();
  undoTimer = setInterval(tick, 1000);
}

function disarmUndo() {
  undoState = null;
  if (undoTimer) { clearInterval(undoTimer); undoTimer = null; }
  const btn = document.getElementById("undoBtn");
  if (btn) { btn.hidden = true; btn.textContent = t("undo"); }
}

async function undoLast() {
  if (!undoState) return;
  const btn = document.getElementById("undoBtn");
  const p = undoState.payload;
  btn.disabled = true;
  btn.textContent = t("undoing");

  return fetch(API_URL, {
    method: "POST", redirect: "follow",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({ type: "void_entry", token: INGEST_TOKEN,
                           entryId: p.entryId, date: p.date,
                           employees: p.employees, reason: "undo by user",
                           clientTime: new Date().toISOString(), appVersion: APP_VERSION })
  })
  .then(async res => {
    if (!res.ok) throw new Error("HTTP " + res.status);
    const body = await res.text();
    if (looksLikeSaveFailure(body)) throw new Error("the server refused the undo");
    // Drop it from the local "already submitted today" memory too, or the next
    // entry would warn about an entry that no longer counts.
    try {
      const kept = readLastSent().filter(x => x.entryId !== p.entryId);
      localStorage.setItem(LASTSENT_KEY, JSON.stringify(kept));
    } catch (e) { /* ignore */ }
    disarmUndo();
    const title = document.querySelector(".success-title");
    const ring = document.querySelector(".success-ring");
    if (ring) ring.textContent = "↩";
    if (title) title.textContent = t("undone");
    document.getElementById("successDetail").innerHTML =
      "That entry has been marked void.<br>Tap <strong>+ New Entry</strong> to record it again.";
  })
  .catch(err => {
    btn.disabled = false;
    btn.textContent = "Undo failed — tap to retry";
    showError("⚠️ Could not undo — " + ((err && err.message) || "no connection")
      + ". The entry is still recorded. Tell your shift leader if it is wrong.");
  });
}

// Queued, not saved. Deliberately worded and coloured differently from the green
// "Saved!" screen: telling someone their entry is safely in the sheet when it is
// actually sitting on their phone is the exact class of lie this whole pass has
// been removing.
function showQueued(date, employees, items, rolesStr) {
  const ring = document.querySelector(".success-ring");
  const title = document.querySelector(".success-title");
  if (ring) { ring.textContent = "⏳"; ring.classList.add("queued"); }
  if (title) { title.textContent = t("queuedTitle"); title.classList.add("queued"); }
  document.getElementById("successDetail").innerHTML =
    "<strong>No connection — not in the sheet yet.</strong><br>"
    + "It sends automatically when you are back online. Keep this page open.<br><br>"
    + escapeHtml(date) + "<br>"
    + employees.map(n => "<span>" + escapeHtml(n) + "</span>").join(' ')
    + "<br>" + items.map(it => "<span>" + escapeHtml(shortDish(it.dish, it.letter)) + " &times;" + it.qty + "</span>").join(' ')
    + "<br><span>" + escapeHtml(rolesStr) + "</span>";
  document.getElementById("formSection").style.display = "none";
  document.getElementById("submitBar").style.display = "none";
  document.getElementById("successScreen").classList.add("visible");
}

function resetForm() {
  document.querySelectorAll(".emp-chip").forEach(c => { c.classList.remove("checked"); c.classList.remove("disabled"); });
  DISH_LETTERS.forEach(l => {
    const inp = document.getElementById("dish_"+l);
    if (inp) inp.value = "";
    const w = document.getElementById("waste_"+l);
    if (w) w.value = "";
    const tile = document.getElementById("tile_"+l);
    if (tile) { tile.classList.remove("has-value"); tile.classList.remove("has-waste"); }
  });
  document.getElementById("comment").value = "";
  document.querySelectorAll(".role-tab").forEach(t => t.classList.remove("active"));
  setRolesEnabled(false);
  const btn = document.getElementById("submitBtn");
  btn.disabled = false; btn.textContent = t("submit");
  delete btn.dataset.entryId;   // a fresh entry must never reuse a submitted id
  document.getElementById("successScreen").classList.remove("visible");
  // The queued screen reuses these nodes, so put them back or the next genuine
  // save would show an hourglass and "Saved on this phone".
  const ring = document.querySelector(".success-ring");
  const title = document.querySelector(".success-title");
  if (ring) { ring.textContent = "✓"; ring.classList.remove("queued"); }
  if (title) { title.textContent = t("saved"); title.classList.remove("queued"); }
  document.getElementById("formSection").style.display = "";
  document.getElementById("submitBar").style.display = "";
  clearError();
  clearDraft();
  disarmUndo();          // the window belongs to the entry just left behind
  updateTotal();
  updateRate();
  updateDupeBanner();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// --- Running total: the cheapest typo catcher we have -----------------------
function currentTotal() {
  let total = 0;
  DISH_LETTERS.forEach(l => {
    const inp = document.getElementById("dish_"+l);
    if (!inp) return;
    const qty = parseCount(inp.value);
    if (qty > 0) total += qty;
  });
  return total;
}
function currentWaste() {
  let w = 0;
  DISH_LETTERS.forEach(l => {
    const el = document.getElementById("waste_"+l);
    if (!el) return;
    const q = parseCount(el.value);
    if (q > 0) w += q;
  });
  return w;
}
function updateTotal() {
  const total = currentTotal();
  const waste = currentWaste();
  // Waste is appended only when non-zero, so the normal case stays a single
  // uncluttered number that a mistyped digit still stands out against.
  document.getElementById("totalLine").textContent =
    t("total") + ": " + total + " " + (total === 1 ? t("dish") : t("dishesWord"))
    + (waste > 0 ? "  ·  " + waste + " " + t("waste") : "");
}

// --- Draft persistence ------------------------------------------------------
const DRAFT_KEY = "bb_assembly_draft_v1";
const DRAFT_MAX_AGE_MS = 18 * 60 * 60 * 1000;

// Counts are keyed by letter and the weekly task reassigns letters to other
// dishes, so a draft is only valid while DISH_NAMES is byte-identical.
function dishSignature() {
  return DISH_LETTERS.map(l => l+"="+DISH_NAMES[l]).join("|");
}

function saveDraft() {
  const counts = {};
  const wastes = {};
  DISH_LETTERS.forEach(l => {
    const inp = document.getElementById("dish_"+l);
    if (inp && inp.value !== "") counts[l] = inp.value;
    const w = document.getElementById("waste_"+l);
    if (w && w.value !== "") wastes[l] = w.value;
  });
  const chip = document.querySelector(".emp-chip.checked");
  const draft = {
    signature: dishSignature(),
    day: getTodayLocal(),
    savedAt: Date.now(),
    date: document.getElementById("date").value,
    employee: chip ? chip.dataset.name : "",
    roles: getSelectedRoles(),
    comment: document.getElementById("comment").value,
    startTime: document.getElementById("startTime").value,
    endTime: document.getElementById("endTime").value,
    counts: counts,
    wastes: wastes
  };
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  } catch (e) { /* private mode or quota: drafts are best effort */ }
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
}

function readDraft() {
  let raw = null;
  try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { return null; }
  if (!raw) return null;
  let draft = null;
  try { draft = JSON.parse(raw); } catch (e) { clearDraft(); return null; }
  if (!draft || typeof draft !== "object") { clearDraft(); return null; }
  if (draft.signature !== dishSignature()) { clearDraft(); return null; }
  if (draft.day !== getTodayLocal()) { clearDraft(); return null; }
  if (!draft.savedAt || (Date.now() - draft.savedAt) > DRAFT_MAX_AGE_MS) { clearDraft(); return null; }
  return draft;
}

function restoreDraft() {
  const draft = readDraft();
  if (!draft) return;
  if (draft.date) document.getElementById("date").value = draft.date;
  if (draft.comment) document.getElementById("comment").value = draft.comment;
  if (draft.startTime) document.getElementById("startTime").value = draft.startTime;
  if (draft.endTime) document.getElementById("endTime").value = draft.endTime;
  const counts = draft.counts || {};
  const wastes = draft.wastes || {};
  DISH_LETTERS.forEach(l => {
    const tile = document.getElementById("tile_"+l);
    if (Object.prototype.hasOwnProperty.call(counts, l)) {
      const inp = document.getElementById("dish_"+l);
      if (inp) {
        inp.value = counts[l];
        if (tile) tile.classList.toggle("has-value", parseCount(inp.value) > 0);
      }
    }
    if (Object.prototype.hasOwnProperty.call(wastes, l)) {
      const w = document.getElementById("waste_"+l);
      if (w) {
        w.value = wastes[l];
        if (tile) tile.classList.toggle("has-waste", parseCount(w.value) > 0);
      }
    }
  });
  // Replay real clicks so chips, the disabling of the other chips and the
  // roles-enabled state come from the existing handlers, not a second copy.
  if (draft.employee) {
    const chip = [...document.querySelectorAll(".emp-chip")].find(c => c.dataset.name === draft.employee);
    if (chip) chip.click();
  }
  const roles = draft.roles || [];
  roleTabs.querySelectorAll(".role-tab").forEach(tab => {
    if (roles.indexOf(tab.dataset.role) !== -1) tab.click();
  });
}

// --- Did the save really land? ----------------------------------------------
// We cannot change the Apps Script and do not know doPost's exact reply, so
// only treat a response as failed when it actually says so.
function looksLikeSaveFailure(body) {
  const text = (body || "").trim();
  if (!text) return false;
  let parsed = null;
  let isJson = true;
  try { parsed = JSON.parse(text); } catch (e) { isJson = false; }
  if (isJson) {
    if (!parsed || typeof parsed !== "object") return false;
    const status = String(parsed.status || parsed.result || "").toLowerCase();
    if (status === "error" || status === "failed") return true;
    if (parsed.ok === false || parsed.success === false) return true;
    if (parsed.error || parsed.errorMessage) return true;
    return false;
  }
  return /<html|Exception|ScriptError|errorMessage/i.test(text);
}

// The server explains itself in `error`. Showing that beats "something went wrong",
// because the person reading it is the person who can usually fix it.
function firstError(body) {
  try {
    const j = JSON.parse((body || "").trim());
    if (j && (j.error || j.errorMessage)) return String(j.error || j.errorMessage);
  } catch (e) { /* not JSON */ }
  return "the server did not say why";
}

// --- Shift hours, so throughput is derivable ---------------------------------
// Counts alone cannot answer "dishes per hour", which is the number that makes
// this data actionable. Two optional time fields are the cheapest way to get it:
// a start/stop timer sounds tidier but breaks the moment someone forgets to stop
// it, and a half-finished timer is worse than a blank field.
//
// Overnight shifts are the normal case here (kitchen-tasks shows 21:00-04:00), so
// an end time earlier than the start means "crossed midnight", not "typo".
function shiftMinutes() {
  const s = document.getElementById("startTime").value;
  const e = document.getElementById("endTime").value;
  if (!s || !e) return null;
  const [sh, sm] = s.split(":").map(Number);
  const [eh, em] = e.split(":").map(Number);
  if ([sh, sm, eh, em].some(n => !isFinite(n))) return null;
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins <= 0) mins += 24 * 60;        // overnight shift
  return mins;
}

function updateRate() {
  const el = document.getElementById("rateLine");
  if (!el) return;
  const mins = shiftMinutes();
  const total = currentTotal();
  el.classList.remove("warn");
  if (mins === null) { el.textContent = ""; return; }
  const hrs = mins / 60;
  // A 16h+ span almost always means one of the two fields is wrong, and a bad
  // duration silently poisons every throughput number built on it later.
  if (hrs > 16) {
    el.textContent = t("checkTimes") + " " + hrs.toFixed(1) + "h " + t("checkTimesEnd");
    el.classList.add("warn");
    return;
  }
  const label = Math.floor(mins / 60) + "h " + String(mins % 60).padStart(2, "0") + "m";
  el.textContent = total > 0
    ? label + "  ·  " + (total / hrs).toFixed(1) + " " + t("perHour")
    : label;
}

// --- Already submitted today -------------------------------------------------
// There is no edit path, so a second entry for the same person on the same day is
// usually someone who forgot they already submitted. Warn, do not block: a
// genuine second shift entry is legitimate and the app must not refuse it.
const LASTSENT_KEY = "bb_last_sent_v1";

function readLastSent() {
  try {
    const a = JSON.parse(localStorage.getItem(LASTSENT_KEY) || "[]");
    return Array.isArray(a) ? a : [];
  } catch (e) { return []; }
}
function noteSent(date, employee, total, entryId) {
  const a = readLastSent().filter(x => x.date === getTodayLocal());   // today only
  // entryId is stored so an undo can remove the matching record: otherwise the
  // next entry would warn about a submission that has since been voided.
  a.push({ date: date, employee: employee, total: total, at: Date.now(), entryId: entryId || "" });
  try { localStorage.setItem(LASTSENT_KEY, JSON.stringify(a.slice(-20))); } catch (e) {}
}
function updateDupeBanner() {
  const el = document.getElementById("dupeBanner");
  if (!el) return;
  const chip = document.querySelector(".emp-chip.checked");
  const date = document.getElementById("date").value;
  if (!chip || !date) { el.classList.remove("visible"); return; }
  const prior = readLastSent().filter(x => x.date === date && x.employee === chip.dataset.name);
  if (!prior.length) { el.classList.remove("visible"); return; }
  const last = prior[prior.length - 1];
  const t = new Date(last.at);
  const hh = String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
  el.textContent = chip.dataset.name + " already submitted " + last.total
    + (last.total === 1 ? " dish" : " dishes") + " for this date at " + hh
    + ". If this is a second shift, carry on — otherwise you may be double-counting.";
  el.classList.add("visible");
}

// --- Applying the language ---------------------------------------------------
// Re-labels in place rather than reloading, so a mid-entry switch never costs
// someone their counts.
function applyLang(lang) {
  LANG = STRINGS[lang] ? lang : "en";
  document.documentElement.lang = LANG;
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) { /* ignore */ }

  const set = (sel, val) => { const el = document.querySelector(sel); if (el) el.textContent = val; };
  set(".header-title", t("title"));
  set("#linkSummary", t("summary") + " ›");
  set("#linkTasks", t("tasks") + " ›");
  set("#gloveToggle", t("glove"));
  set("#labDate", t("date"));
  set("#labTeam", t("team"));
  set("#labDishes", t("dishes"));
  set("#labRole", t("role"));
  set("#labFrom", t("from"));
  set("#labTo", t("to"));

  const lh = document.getElementById("labHours");
  if (lh) lh.innerHTML = escapeHtml(t("hours"))
    + ' <span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">'
    + escapeHtml(t("hoursHint")) + '</span>';
  const lc = document.getElementById("labComment");
  if (lc) lc.innerHTML = escapeHtml(t("comment"))
    + ' <span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">'
    + escapeHtml(t("optional")) + '</span>';

  const ta = document.getElementById("comment");
  if (ta) ta.placeholder = t("commentPlaceholder");

  document.querySelectorAll(".waste-lab").forEach(el => { el.textContent = t("waste"); });

  const btn = document.getElementById("submitBtn");
  if (btn && !btn.disabled) btn.textContent = t("submit");
  const again = document.querySelector(".btn-again");
  if (again) again.textContent = t("newEntry");
  const undoBtn = document.getElementById("undoBtn");
  if (undoBtn && undoBtn.hidden) undoBtn.textContent = t("undo");

  document.querySelectorAll(".lang-btn").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false");
  });

  updateTotal();
  updateRate();
}

function setLang(lang) { applyLang(lang); }

// --- Glove mode --------------------------------------------------------------
// Remembered per device rather than per session: whoever assembles in gloves does
// it every shift, and re-enabling it nightly would be its own small insult.
const GLOVE_KEY = "bb_glove_v1";

function applyGlove(on) {
  document.body.classList.toggle("glove", !!on);
  const b = document.getElementById("gloveToggle");
  if (b) b.setAttribute("aria-pressed", on ? "true" : "false");
}
function toggleGlove() {
  const on = !document.body.classList.contains("glove");
  applyGlove(on);
  try { localStorage.setItem(GLOVE_KEY, on ? "1" : "0"); } catch (e) { /* ignore */ }
}
(function () {
  let v = null;
  try { v = localStorage.getItem(GLOVE_KEY); } catch (e) { /* ignore */ }
  applyGlove(v === "1");
})();

// --- Outbox: a submit must survive no signal ---------------------------------
// The form used to leave a failed entry on screen and ask staff to tap again.
// That works only while the tab stays open, and this runs on kitchen wifi.
//
// A NETWORK failure now queues the entry and reports it as queued. A SERVER
// rejection does not: the sheet actively refused it, so retrying unchanged would
// just fail again, and the person should see the error. The entryId from #11 is
// what makes queued retries safe -- a replay cannot duplicate the shift.
const OUTBOX_KEY = "bb_assembly_outbox_v1";

function readQueue() {
  try {
    const a = JSON.parse(localStorage.getItem(OUTBOX_KEY) || "[]");
    return Array.isArray(a) ? a : [];
  } catch (e) { try { localStorage.removeItem(OUTBOX_KEY); } catch (e2) {} return []; }
}
function writeQueue(a) {
  try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(a)); } catch (e) { /* private mode */ }
}

function updateQueueBanner() {
  const el = document.getElementById("queueBanner");
  if (!el) return;
  const q = readQueue();
  if (!q.length) { el.classList.remove("visible"); el.textContent = ""; return; }
  const stuck = q.filter(x => x.stuck);
  const waiting = q.length - stuck.length;
  const parts = [];
  if (waiting) {
    parts.push(waiting + (waiting === 1 ? " entry is" : " entries are")
      + " waiting to send. Keep this page open, it retries automatically.");
  }
  if (stuck.length) {
    // Said plainly, because the person reading it has to decide whether to act.
    parts.push(stuck.length + (stuck.length === 1 ? " entry has" : " entries have")
      + " not been accepted: " + (stuck[0].why || "the server did not say why")
      + ". Nothing is lost, it is still on this phone. Tell your shift leader.");
  }
  el.textContent = parts.join(" ");
  el.classList.add("visible");
}

// How many refusals before an entry stops blocking the ones behind it. It is never
// thrown away, it is set aside and reported.
const MAX_TRIES = 5;

let sending = false;
async function flushQueue() {
  if (sending) return;
  sending = true;
  try {
    // Only entries that are still worth retrying. One the server keeps refusing is
    // skipped so it cannot hold up a whole night's work behind it.
    let pending = readQueue().filter(x => !x.stuck);
    while (pending.length) {
      const item = pending[0];
      let ok = false, refused = false, why = "";
      try {
        const res = await fetch(API_URL, {
          method: "POST", redirect: "follow",
          headers: {"Content-Type": "text/plain;charset=utf-8"},
          body: JSON.stringify(item.payload)
        });
        const body = await res.text();
        if (res.ok && !looksLikeSaveFailure(body)) ok = true;
        else { refused = true; why = firstError(body); }
      } catch (e) { ok = false; }    // no network at all: not the entry's fault

      if (ok) {
        // Remove by id, not position: another submit during the await would
        // otherwise let a shift() drop the wrong entry.
        writeQueue(readQueue().filter(x => x.id !== item.id));
      } else if (refused) {
        /*
         * NOTHING IS DELETED HERE, and that is the whole point of this pass.
         *
         * The old version removed an entry the server refused and told the cook to
         * type it in again. When the spreadsheet ran out of storage every entry came
         * back refused, so three weeks of shifts were discarded by this exact branch
         * while everyone assumed they were saved. A refusal now costs a retry and a
         * visible banner, never the data.
         */
        const q = readQueue().map(x => x.id === item.id
          ? Object.assign({}, x, { tries: (x.tries || 0) + 1, why: why,
                                   stuck: (x.tries || 0) + 1 >= MAX_TRIES })
          : x);
        writeQueue(q);
      } else {
        break;                       // offline: stop, keep order, try again later
      }
      updateQueueBanner();
      pending = readQueue().filter(x => !x.stuck);
    }
  } finally {
    sending = false;
    updateQueueBanner();
  }
}

function queueEntry(payload) {
  const q = readQueue();
  q.push({ id: payload.entryId || newEntryId(), queuedAt: Date.now(), tries: 0,
           stuck: false, why: "", payload: payload });
  writeQueue(q);
  updateQueueBanner();
}

window.addEventListener("online", flushQueue);
setInterval(flushQueue, 60000);

// --- Service worker ----------------------------------------------------------
// Registered last so a failure here can never stop the form from working.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    // Relative path on purpose: an absolute "/sw.js" would be out of scope on a
    // project Pages site served from /assembly-tracking-app/.
    navigator.serviceWorker.register("sw.js").catch(() => { /* http, or blocked */ });
  });
}

document.getElementById("date").addEventListener("change", () => { saveDraft(); updateDupeBanner(); });
document.getElementById("comment").addEventListener("input", saveDraft);
["startTime","endTime"].forEach(id => {
  document.getElementById(id).addEventListener("change", () => { updateRate(); saveDraft(); });
  document.getElementById(id).addEventListener("input", updateRate);
});
// Stored choice wins; the browser's language is only an initial guess on a device
// that has never chosen. Runs before restoreDraft so nothing renders in one
// language and then flips.
(function () {
  let stored = null;
  try { stored = localStorage.getItem(LANG_KEY); } catch (e) { /* ignore */ }
  const guess = /^de\b/i.test(navigator.language || "") ? "de" : "en";
  applyLang(stored || guess);
})();

restoreDraft();
updateTotal();
updateRate();
updateDupeBanner();
updateQueueBanner();
flushQueue();
// After restoreDraft, so a restored selection is never blown away by a refresh.
refreshRosterFromServer();
// Asked after the grid exists, so a phone with no signal has already rendered the
// fallback and a phone with signal corrects it a moment later.
refreshMenuFromServer();
</script>
</body>
