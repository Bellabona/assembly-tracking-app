<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B4A33" />
<title>BellaBona &#127837; Assembly Summary</title>
<style>
  /* Bella & Bona — Assembly Summary.
     Same design system as the entry screen. The markup and every render function
     in this page are unchanged; only the surface they draw on is new. */
  :root {
    --brand:#0B4A33; --brand-dark:#06301F; --brand-mid:#116044;
    --brand-soft:#E8F1EB; --brand-softer:#F2F7F3;
    --lime:#8EDB5A; --lime-ink:#3E7A1F; --lime-deep:#6BC23F;
    --bg:#F4F6F3; --card:#FFFFFF; --card-2:#FAFBF9;
    --line:#E2E7E1; --line-2:#D3DAD2;
    --ink:#16211B; --ink-2:#425049; --muted:#6E7D74; --faint:#93A098;
    --danger:#B3261E; --danger-bg:#FDECEA; --danger-line:#F3C9C4;
    --warn:#8A5A09; --warn-bg:#FDF4E3; --warn-line:#EFDCB4;
    --radius:14px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(16,36,27,0.05);
    --shadow:0 2px 8px rgba(16,36,27,0.06);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:var(--font); background:var(--bg); color:var(--ink);
    margin:0; min-height:100dvh; -webkit-font-smoothing:antialiased;
  }
  :focus-visible { outline:3px solid var(--lime-deep); outline-offset:2px; border-radius:4px; }

  header {
    position:sticky; top:0; z-index:10;
    padding:calc(10px + env(safe-area-inset-top)) 20px 10px;
    background:var(--brand); border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  h1 { font-size:15px; font-weight:650; margin:0; letter-spacing:-0.01em; color:#FFFFFF; }
  .sub { font-size:12px; color:rgba(255,255,255,0.72); font-weight:550; margin-top:2px; }
  header a {
    color:rgba(255,255,255,0.72); font-size:12.5px; font-weight:550;
    text-decoration:none; white-space:nowrap; transition:color 0.15s;
  }
  header a:hover { color:#FFFFFF; }

  main { padding:20px 20px calc(32px + env(safe-area-inset-bottom)); max-width:1100px; margin:auto; }

  .datebar { display:flex; gap:10px; align-items:center; margin-bottom:22px; flex-wrap:wrap; }
  .datebar input[type=date] {
    background:var(--card); border:1px solid var(--line); color:var(--ink);
    border-radius:var(--radius); padding:0 14px; height:48px; font-size:16px; font-weight:600;
    font-family:inherit; outline:none; color-scheme:light; flex:1; min-width:170px; max-width:260px;
    box-shadow:var(--shadow-sm); transition:border-color 0.15s, box-shadow 0.15s;
  }
  .datebar input[type=date]:focus { border-color:var(--brand-mid); box-shadow:0 0 0 3px rgba(17,96,68,0.12); }
  .datebar button {
    background:var(--card); border:1px solid var(--line-2); color:var(--ink-2);
    border-radius:var(--radius); padding:0 16px; font-size:14px; font-weight:600;
    font-family:inherit; cursor:pointer; min-height:48px;
    box-shadow:var(--shadow-sm); transition:background 0.15s, border-color 0.15s, color 0.15s;
  }
  .datebar button:hover { background:var(--brand-soft); border-color:var(--brand-mid); color:var(--brand); }
  .datebar button:active { transform:scale(0.98); }

  /* The few numbers a shift leader acts on. */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
  @media (max-width:640px) { .stats { grid-template-columns:repeat(2,1fr); } }
  .stat {
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow-sm);
    backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .stat .k {
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); margin-bottom:8px;
  }
  .stat .v { font-size:30px; font-weight:700; line-height:1; color:var(--ink); letter-spacing:-0.02em; }
  .stat .v.small { font-size:22px; }
  .stat.warn { border-color:var(--warn-line); background:var(--warn-bg); }
  .stat.warn .v { color:var(--warn); }

  h2 {
    font-size:12px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--muted); margin:28px 0 10px; display:flex; align-items:center; gap:10px;
  }
  h2::after { content:''; flex:1; height:1px; background:var(--line); }

  .card {
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow-sm);
    backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; min-width:460px; }
  th, td { padding:13px 16px; text-align:left; white-space:nowrap; }
  th {
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--muted); border-bottom:1px solid var(--line); background:var(--card-2);
  }
  td { border-bottom:1px solid var(--line); color:var(--ink-2); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:var(--brand-softer); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; font-weight:650; }
  td.name { font-weight:650; color:var(--ink); white-space:normal; }
  .waste { color:var(--danger); }
  .zero { color:var(--faint); font-weight:500; }

  /* Share-of-total bar behind the dish rows: the mix is easier to see than read. */
  .barcell { position:relative; min-width:160px; }
  .bar {
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    height:22px; border-radius:5px;
    background:var(--brand-soft);
  }
  .barlabel { position:relative; padding-left:10px; font-variant-numeric:tabular-nums; font-weight:650; color:var(--ink); }

  .msg { padding:28px 20px; text-align:center; color:var(--muted); font-size:14px; line-height:1.65; }
  .msg strong { color:var(--ink); display:block; margin-bottom:8px; font-size:15px; font-weight:650; }
  .msg.err { color:var(--danger); }
  .msg code {
    background:var(--brand-softer); border:1px solid var(--line); border-radius:5px;
    padding:1px 5px; font-size:12.5px;
  }
  .foot { margin-top:24px; text-align:center; font-size:12px; color:var(--faint); line-height:1.7; }

</style>

<header>
  <div>
    <h1>Assembly Summary</h1>
    <div class="sub" id="sub">Loading…</div>
  </div>
  <div style="text-align:right">
    <a href="index.html">&lsaquo; Entry form</a>
  </div>
</header>

<main>
  <div class="datebar">
    <input type="date" id="date">
    <button type="button" id="prev">&lsaquo; Prev</button>
    <button type="button" id="today">Today</button>
    <button type="button" id="next">Next &rsaquo;</button>
    <button type="button" id="reload">Refresh</button>
  </div>

  <div class="stats" id="stats"></div>

  <h2>Per person</h2>
  <div class="card"><div class="tablewrap"><div id="people"></div></div></div>

  <h2>Dish mix</h2>
  <div class="card"><div class="tablewrap"><div id="dishes"></div></div></div>

  <div class="foot" id="foot"></div>
</main>

<script>
// The Apps Script this used to read is gone, which is why this page showed
// nothing from October onwards. Same query, same answer shape, new address.
const API_URL = "https://potsdam-pnl.vercel.app/api/assembly";
const INGEST_TOKEN = "bbasm_dE_KB2ZZN7KFSuRuqnCiOWVJrPJpKEUKT01-uLK3PtQ";

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function todayLocal() {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function shiftDate(iso, days) {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+days);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function hhmm(mins) {
  if (!mins) return "—";
  return Math.floor(mins/60)+"h "+String(mins%60).padStart(2,"0")+"m";
}

function stat(k, v, opts) {
  opts = opts || {};
  return '<div class="stat'+(opts.warn?' warn':'')+'"><div class="k">'+esc(k)+'</div>'
       + '<div class="v'+(opts.small?' small':'')+'">'+esc(v)+'</div></div>';
}

function renderStats(d) {
  const rate = (d.totalMinutes && d.totalDishes)
    ? (d.totalDishes/(d.totalMinutes/60)).toFixed(1) : null;
  // Waste is shown as a share, because 12 waste means nothing without the volume
  // it came from.
  const pct = d.totalDishes > 0
    ? ((d.totalWaste/(d.totalDishes+d.totalWaste))*100).toFixed(1)+"%" : "—";
  document.getElementById("stats").innerHTML =
      stat("Dishes", d.totalDishes)
    + stat("Waste", d.totalWaste + (d.totalWaste ? "  ("+pct+")" : ""), {warn: d.totalWaste>0, small: d.totalWaste>0})
    + stat("People", d.people || (d.byPerson||[]).length)
    + stat("Entries", d.entries);
}

function renderPeople(rows) {
  if (!rows.length) { document.getElementById("people").innerHTML = '<div class="msg">No entries.</div>'; return; }
  const body = rows.map(p => {
    const w = p.waste ? '<td class="num waste">'+p.waste+'</td>' : '<td class="num zero">0</td>';
    return '<tr><td class="name">'+esc(p.employee)+'</td>'
      + '<td>'+esc(p.role||"—")+'</td>'
      + '<td class="num">'+p.dishes+'</td>'
      + w
      + '<td class="num">'+hhmm(p.minutes)+'</td>'
      + '<td class="num">'+(p.perHour!=null?p.perHour:"—")+'</td></tr>';
  }).join("");
  document.getElementById("people").innerHTML =
    '<table><thead><tr><th>Name</th><th>Role</th><th class="num">Dishes</th>'
    + '<th class="num">Waste</th><th class="num">Shift</th><th class="num">Per hour</th>'
    + '</tr></thead><tbody>'+body+'</tbody></table>';
}

function renderDishes(rows) {
  if (!rows.length) { document.getElementById("dishes").innerHTML = '<div class="msg">No entries.</div>'; return; }
  const max = Math.max.apply(null, rows.map(r => r.qty)) || 1;
  const body = rows.map(r => {
    const pct = Math.max(2, Math.round((r.qty/max)*100));
    const w = r.waste ? '<td class="num waste">'+r.waste+'</td>' : '<td class="num zero">0</td>';
    return '<tr><td class="name">'+esc(r.dish)+'</td>'
      + '<td class="barcell"><div class="bar" style="width:'+pct+'%"></div>'
      +   '<span class="barlabel">'+r.qty+'</span></td>'
      + w + '</tr>';
  }).join("");
  document.getElementById("dishes").innerHTML =
    '<table><thead><tr><th>Dish</th><th class="num">Assembled</th><th class="num">Waste</th>'
    + '</tr></thead><tbody>'+body+'</tbody></table>';
}

function showMessage(where, html, isErr) {
  document.getElementById(where).innerHTML =
    '<div class="msg'+(isErr?' err':'')+'">'+html+'</div>';
}

async function load(date) {
  document.getElementById("sub").textContent = "Loading "+date+"…";
  document.getElementById("stats").innerHTML = "";
  showMessage("people", "Loading…");
  showMessage("dishes", "Loading…");
  document.getElementById("foot").textContent = "";

  let data = null;
  try {
    const res = await fetch(API_URL+"?view=today&date="+encodeURIComponent(date),
                            { redirect:"follow", headers:{ "Authorization":"Bearer "+INGEST_TOKEN } });
    if (!res.ok) throw new Error("HTTP "+res.status);
    const body = await res.text();
    try { data = JSON.parse(body); }
    catch (e) {
      // A proxy, a captive portal or a login page answers with HTML rather than
      // JSON. Say that it was not summary data rather than guessing why.
      throw new Error("the backend did not return summary data");
    }
    if (data && data.ok === false) throw new Error(data.error || "the backend reported an error");
    // An UNPATCHED script returns valid JSON that simply is not a summary -- its
    // health check. Without this, `hasData` reads as undefined and the page would
    // say "nothing recorded today", which looks like a quiet shift rather than a
    // backend that cannot answer the question at all.
    if (!data || !Object.prototype.hasOwnProperty.call(data, "hasData")) {
      throw new Error("__NOT_PATCHED__");
    }
  } catch (err) {
    document.getElementById("sub").textContent = date;
    const notPatched = err && err.message === "__NOT_PATCHED__";
    showMessage("people", notPatched
      ? '<strong>The backend answered, but not with a summary</strong>'
        + 'Something between this page and the server replied in its place, which is usually '
        + 'kitchen wifi asking you to sign in. Entries staff submit are unaffected.'
      : '<strong>Could not load</strong>'+esc((err && err.message) || "no connection")
        + '<br><br>Entries staff submit are unaffected by this: only this view could not '
        + 'read them. The same numbers are on the Assembly screen in the P&amp;L.', true);
    showMessage("dishes", "—");
    return;
  }

  if (!data.hasData) {
    document.getElementById("sub").textContent = date;
    document.getElementById("stats").innerHTML = "";
    showMessage("people", '<strong>Nothing recorded for '+esc(date)+'</strong>'
      + 'Either no one has submitted yet, or every entry for that date was undone.');
    showMessage("dishes", "—");
    return;
  }

  const byPerson = data.byPerson || [];
  data.totalMinutes = byPerson.reduce((a,p) => a + (p.minutes||0), 0);
  document.getElementById("sub").textContent = date;
  renderStats(data);
  renderPeople(byPerson);
  renderDishes(data.byDish || []);
  document.getElementById("foot").innerHTML =
    "Voided entries are excluded. Generated "
    + esc(new Date(data.generatedAt || Date.now()).toLocaleTimeString());
}

const dateEl = document.getElementById("date");
const params = new URLSearchParams(location.search);
dateEl.value = params.get("date") || todayLocal();

dateEl.addEventListener("change", () => load(dateEl.value));
document.getElementById("prev").onclick   = () => { dateEl.value = shiftDate(dateEl.value,-1); load(dateEl.value); };
document.getElementById("next").onclick   = () => { dateEl.value = shiftDate(dateEl.value, 1); load(dateEl.value); };
document.getElementById("today").onclick  = () => { dateEl.value = todayLocal(); load(dateEl.value); };
document.getElementById("reload").onclick = () => load(dateEl.value);

load(dateEl.value);
</script>
